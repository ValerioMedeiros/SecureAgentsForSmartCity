# Orion + MongoDB live in Fiware_MCP/docker-compose.yml — start those first.
# This file only manages services specific to SecureAgentsForSmartCity.
services:
  opa:
    image: openpolicyagent/opa:0.68.0
    container_name: smartcity-opa
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--set=decision_logs.console=true"
      - "/policies"
    ports:
      - "8181:8181"
    volumes:
      - ./policies:/policies:ro
