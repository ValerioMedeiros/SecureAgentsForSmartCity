services:
  mongo:
    image: mongo:7.0
    container_name: smartcity-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  orion:
    image: fiware/orion:3.10.1
    container_name: smartcity-orion
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "1026:1026"
    command: -dbhost mongo -logLevel DEBUG

  opa:
    image: openpolicyagent/opa:0.68.0
    container_name: smartcity-opa
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--set=decision_logs.console=true"
      - "/policies"
    ports:
      - "8181:8181"
    volumes:
      - ./policies:/policies:ro

  fiware-mcp:
    build:
      context: .
      dockerfile: Dockerfile.fiware-mcp
    container_name: smartcity-fiware-mcp
    depends_on:
      orion:
        condition: service_started
    ports:
      - "8001:8001"
    environment:
      - ORION_BASE_URL=http://orion:1026
      - ORION_FIWARE_SERVICE=openiot
      - ORION_FIWARE_SERVICE_PATH=/
    restart: unless-stopped

  pump-mcp:
    build:
      context: .
      dockerfile: Dockerfile.pump-mcp
    container_name: smartcity-pump-mcp
    ports:
      - "8002:8002"
    restart: unless-stopped

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp-server
    container_name: smartcity-mcp-server
    depends_on:
      - fiware-mcp
      - pump-mcp
      - opa
    ports:
      - "8000:8000"
    environment:
      - FIWARE_MCP_URL=http://fiware-mcp:8001/mcp
      - PUMP_MCP_URL=http://pump-mcp:8002/mcp
      - OPA_URL=http://opa:8181
    restart: unless-stopped

  monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    container_name: smartcity-monitor
    depends_on:
      - mcp-server
      - fiware-mcp
      - pump-mcp
    ports:
      - "8010:8010"
    environment:
      - MONITOR_CALLBACK_URL=http://monitor:8010/monitor/notify
      - FIWARE_MCP_URL=http://fiware-mcp:8001/mcp
      - PUMP_MCP_URL=http://pump-mcp:8002/mcp
      - MCP_SERVER_URL=http://mcp-server:8000/mcp
    restart: unless-stopped

volumes:
  mongo_data:
